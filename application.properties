# Signature Detect & Verify API defaults
# Override via env or by editing this file. Request payload values win when sent.

server.port=8001

# YOLO detection
signature.detect.conf=0.25
signature.detect.iou=0.45
signature.detect.imgsz=768

# izamscientist verification (cosine-like similarity on [0, 1])
signature.verify.threshold=0.7785
